name: Build RPK
on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build projects
        run: |
          shopt -s nullglob
          found=0
          mkdir -p "$GITHUB_WORKSPACE/output_rpk"
          for z in *.zip; do
            found=1
            name="${z%.zip}"
            name="${name// /_}"
            mkdir -p "out/$name"
            unzip -o "$z" -d "out/$name"
            
            MANIFEST_DIR=$(find "out/$name" -name "manifest.json" -exec dirname {} \;)
            
            if [ -n "$MANIFEST_DIR" ]; then
              TARGET_DIR=$(dirname "$MANIFEST_DIR")
              echo "=== Switching to project directory: $TARGET_DIR ==="
              cd "$TARGET_DIR"
              
              if [ ! -f "package.json" ]; then
                cp "$GITHUB_WORKSPACE/out/$name/package.json" ./ 2>/dev/null || cp "$GITHUB_WORKSPACE/out/$name/*/package.json" ./ 2>/dev/null || true
              fi
              
              npm install
              npx aiot build
            else
              echo "Error: manifest.json not found anywhere in the zip!"
              exit 1
            fi
            cd "$GITHUB_WORKSPACE"
          done
          if [ "$found" = 0 ]; then echo "No zip files in repo root"; exit 1; fi
          
          # ГЛОБАЛЬНЫЙ ПОИСК: Ищем .rpk по всей системе Linux (кроме node_modules)
          echo "=== Starting Deep System Search for RPK files ==="
          sudo find / -name "*.rpk" -not -path "*/node_modules/*" -not -path "*/proc/*" -not -path "*/sys/*" -exec cp {} "$GITHUB_WORKSPACE/output_rpk/" \; 2>/dev/null || true
          
          echo "=== Check contents of output folder ==="
          ls -la "$GITHUB_WORKSPACE/output_rpk" || echo "Folder is empty"
      - name: Upload RPK
        uses: actions/upload-artifact@v4
        with:
          name: rpk-build
          path: output_rpk/
          if-no-files-found: error
