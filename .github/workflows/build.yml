name: Build RPK
on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build projects
        run: |
          shopt -s nullglob
          found=0
          mkdir -p "$GITHUB_WORKSPACE/output_rpk"
          for z in *.zip; do
            found=1
            name="${z%.zip}"
            name="${name// /_}"
            mkdir -p "out/$name"
            unzip -o "$z" -d "out/$name"
            
            # Находим, где реально лежит manifest.json
            MANIFEST_DIR=$(find "out/$name" -name "manifest.json" -exec dirname {} \;)
            
            if [ -n "$MANIFEST_DIR" ]; then
              # Поднимаемся на один уровень выше папки src, туда где должен быть package.json
              TARGET_DIR=$(dirname "$MANIFEST_DIR")
              echo "=== Switching to project directory: $TARGET_DIR ==="
              cd "$TARGET_DIR"
              
              # Если package.json остался в самом корне архива, копируем его сюда
              if [ ! -f "package.json" ]; then
                cp "$GITHUB_WORKSPACE/out/$name/package.json" ./ 2>/dev/null || cp "$GITHUB_WORKSPACE/out/$name/*/package.json" ./ 2>/dev/null || true
               Downs
              fi
              
              npm install
              npx aiot build || npx aiot release
              
              # Копируем созданный .rpk файл в безопасное место
              find . -name "*.rpk" -not -path "*/node_modules/*" -exec cp {} "$GITHUB_WORKSPACE/output_rpk/" \;
            else
              echo "Error: manifest.json not found anywhere in the zip!"
              exit 1
            fi
            cd "$GITHUB_WORKSPACE"
          done
          if [ "$found" = 0 ]; then echo "No zip files in repo root"; exit 1; fi
      - name: Upload RPK
        uses: actions/upload-artifact@v4
        with:
          name: rpk-build
          path: output_rpk/*.rpk
          if-no-files-found: error
