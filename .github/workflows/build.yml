      - name: Build projects
        run: |
          shopt -s nullglob
          found=0
          for z in *.zip; do
            found=1
            name="${z%.zip}"
            name="${name// /_}"
            mkdir -p "out/$name"
            unzip -o "$z" -d "out/$name"
            
            # Исправление: если файлы оказались внутри подпапки, заходим в неё
            cd "out/$name"
            if [ ! -f "package.json" ]; then
              cd */ 2>/dev/null || true
            fi
            
            if [ -f "package.json" ]; then
              npm install && npx aiot build
            else
              echo "Error: package.json not found even in subfolders!"
              exit 1
            fi
            # Возвращаемся в корень для следующего архива
            cd "$GITHUB_WORKSPACE"
          done
          if [ "$found" = 0 ]; then echo "No zip files in repo root"; exit 1; fi
          find out -name "*.rpk" -not -path "*/node_modules/*"
