name: Build RPK
on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build projects
        run: |
          shopt -s nullglob
          found=0
          for z in *.zip; do
            found=1
            name="${z%.zip}"
            name="${name// /_}"
            mkdir -p "out/$name"
            unzip -o "$z" -d "out/$name"
            
            TARGET_DIR=$(find "out/$name" -name "package.json" -exec dirname {} \;)
            
            if [ -n "$TARGET_DIR" ]; then
              echo "Found package.json in: $TARGET_DIR"
              cd "$TARGET_DIR"
              npm install
              
              # Запуск полноценного релиза для генерации .rpk файла
              npx aiot release
              
              # Переносим готовый rpk повыше, чтобы его было легче забрать
              mkdir -p "$GITHUB_WORKSPACE/output_rpk"
              find dist/ -name "*.rpk" -exec cp {} "$GITHUB_WORKSPACE/output_rpk/" \;
            else
              echo "Error: package.json not found!"
              exit 1
            fi
            cd "$GITHUB_WORKSPACE"
          done
          if [ "$found" = 0 ]; then echo "No zip files in repo root"; exit 1; fi
      - name: Upload RPK
        uses: actions/upload-artifact@v4
        with:
          name: rpk-build
          # Забираем только наш маленький файл .rpk без лишнего веса
          path: output_rpk/*.rpk
          if-no-files-found: error
