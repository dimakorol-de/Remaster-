name: Build RPK
on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build projects
        run: |
          shopt -s nullglob
          found=0
          mkdir -p "$GITHUB_WORKSPACE/final_rpk"
          for z in *.zip; do
            found=1
            name="${z%.zip}"
            name="${name// /_}"
            mkdir -p "out/$name"
            unzip -o "$z" -d "out/$name"
            
            TARGET_DIR=$(find "out/$name" -name "package.json" -exec dirname {} \;)
            
            if [ -n "$TARGET_DIR" ]; then
              echo "=== Found package.json in: $TARGET_DIR ==="
              cd "$TARGET_DIR"
              
              echo "=== Running npm install ==="
              npm install
              
              echo "=== Running aiot build ==="
              # Запуск с подробным выводом логов ошибок компиляции
              npx aiot build --verbose || true
              
            else
              echo "Error: package.json not found anywhere in the zip!"
              exit 1
            fi
            cd "$GITHUB_WORKSPACE"
          done
          if [ "$found" = 0 ]; then echo "No zip files in repo root"; exit 1; fi
          
          echo "=== Global search for compiled RPK files ==="
          find . -name "*.rpk" -not -path "*/node_modules/*" -exec cp {} "$GITHUB_WORKSPACE/final_rpk/" \;
          
          ls -la "$GITHUB_WORKSPACE/final_rpk/" || echo "final_rpk folder is empty!"
      - name: Upload RPK
        uses: actions/upload-artifact@v4
        with:
          name: rpk-build
          path: final_rpk/*.rpk
          if-no-files-found: error
